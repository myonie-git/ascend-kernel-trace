name: Sync GitHub and GitCode

on:
  push:
    branches: ['**']
    tags: ['**']
  schedule:
    - cron: '2-57/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: github-gitcode-sync
  cancel-in-progress: false

jobs:
  sync:
    if: github.repository == 'myonie-git/ascend-kernel-trace'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main
          persist-credentials: false
      - name: Synchronize without rewriting history
        env:
          SYNC_GITHUB_URL: https://github.com/myonie-git/ascend-kernel-trace.git
          SYNC_GITCODE_URL: https://atomgit.com/myonie/ascend-kernel-trace.git
          GH_SYNC_TOKEN: ${{ github.token }}
          GITCODE_USERNAME: myonie
          GITCODE_TOKEN: ${{ secrets.GITCODE_TOKEN }}
        run: |
          test -n "$GITCODE_TOKEN" || { echo 'GITCODE_TOKEN secret is missing'; exit 1; }
          python3 .github/scripts/sync_repositories.py --execute
